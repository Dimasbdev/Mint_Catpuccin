# --- Palette Settings ---
include themes/mocha.conf

# --- Font Settings ---
font_family      FiraCode Nerd Font Mono
font_size 11.0

# --- Opacity & Padding ---
background_opacity 0.85
dynamic_background_opacity yes
window_padding_width 8
window_margin_width 4
active_border_color #f5c2e7
inactive_border_color #313244

# --- Layouts & Tiling ---
enabled_layouts splits,grid,tall,fat

# --- Tiling Shortcuts (Ala Hyprland) ---
map ctrl+shift+enter launch --location=vsplit --cwd=current
map ctrl+shift+d launch --location=hsplit --cwd=current
map ctrl+shift+w close_window

# --- Navigation between tiled panes ---
map ctrl+shift+left neighboring_window left
map ctrl+shift+right neighboring_window right
map ctrl+shift+up neighboring_window up
map ctrl+shift+down neighboring_window down
map alt+left neighboring_window left
map alt+right neighboring_window right
map alt+up neighboring_window up
map alt+down neighboring_window down

# --- Instant Launch Socket (Remote Control) ---
allow_remote_control yes

# --- Window Close Behavior ---
confirm_os_window_close 0
