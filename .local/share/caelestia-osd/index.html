<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caelestia Modern Pill OSD</title>
  <style>
    :root {
      --bg: rgba(24, 24, 37, 0.88);
      --border: rgba(245, 194, 231, 0.22);
      --surface0: rgba(49, 50, 68, 0.75);
      
      --flamingo: #f5c2e7;
      --mauve: #cba6f7;
      --peach: #fab387;
      --red: #f38ba8;
      --text: #cdd6f4;
      --subtext: #a6adc8;

      --accent: var(--flamingo);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      width: 100vw;
      height: 100vh;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "JetBrains Mono", "SF Pro Display", "Inter", sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 4px;
    }

    .osd-pill {
      width: 100%;
      height: 100%;
      background: var(--bg);
      backdrop-filter: blur(28px) saturate(190%);
      -webkit-backdrop-filter: blur(28px) saturate(190%);
      border: 1px solid var(--border);
      border-radius: 9999px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.55), 0 0 18px rgba(245, 194, 231, 0.1);
      display: flex;
      align-items: center;
      padding: 0 18px;
      gap: 14px;
      transform: translateY(-16px) scale(0.96);
      opacity: 0;
      transition: transform 0.22s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.22s ease;
    }

    .osd-pill.visible {
      transform: translateY(0) scale(1);
      opacity: 1;
    }

    .osd-pill.hidden {
      transform: translateY(-16px) scale(0.96);
      opacity: 0;
      transition: transform 0.26s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.22s ease;
    }

    /* Icon Box */
    .icon-box {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: var(--accent);
      transition: color 0.18s ease;
    }

    .icon-box svg {
      width: 22px;
      height: 22px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Track & Fill */
    .track {
      flex: 1;
      height: 8px;
      background: var(--surface0);
      border-radius: 9999px;
      overflow: hidden;
      position: relative;
    }

    .fill-bar {
      height: 100%;
      width: 50%;
      border-radius: 9999px;
      background: linear-gradient(90deg, var(--accent), var(--accent-gradient, var(--accent)));
      box-shadow: 0 0 10px var(--accent);
      transition: width 0.12s cubic-bezier(0.16, 1, 0.3, 1), background 0.18s ease;
    }

    /* Value Badge */
    .val-badge {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      min-width: 42px;
      text-align: right;
      letter-spacing: 0.2px;
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <div class="osd-pill" id="osdPill">
    <div class="icon-box" id="iconBox">
      <!-- SVG dynamic -->
    </div>
    <div class="track">
      <div class="fill-bar" id="fillBar"></div>
    </div>
    <div class="val-badge" id="valBadge">50%</div>
  </div>

  <script>
    const pill = document.getElementById('osdPill');
    const iconBox = document.getElementById('iconBox');
    const fillBar = document.getElementById('fillBar');
    const valBadge = document.getElementById('valBadge');

    // SVG Icons
    const ICONS = {
      vol_high: `<svg viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>`,
      vol_mid: `<svg viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>`,
      vol_low: `<svg viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon></svg>`,
      vol_mute: `<svg viewBox="0 0 24 24"><line x1="1" y1="1" x2="23" y2="23"></line><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon></svg>`,
      brightness: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>`,
      mic_active: `<svg viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>`,
      mic_mute: `<svg viewBox="0 0 24 24"><line x1="1" y1="1" x2="23" y2="23"></line><path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6"></path><path d="M17 16.95A7 7 0 0 1 5 12v-2m14 0v2a7 7 0 0 1-.11 1.23"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>`
    };

    window.updateOSD = function(data) {
      if (!data) return;

      const type = data.type; // 'volume', 'brightness', 'mic'
      const val = Math.max(0, Math.min(100, data.value || 0));
      const muted = !!data.muted;

      if (type === 'volume') {
        if (muted) {
          iconBox.innerHTML = ICONS.vol_mute;
          document.documentElement.style.setProperty('--accent', 'var(--red)');
          document.documentElement.style.setProperty('--accent-gradient', 'var(--red)');
          fillBar.style.width = '0%';
          valBadge.textContent = 'Muted';
        } else {
          if (val > 60) iconBox.innerHTML = ICONS.vol_high;
          else if (val > 20) iconBox.innerHTML = ICONS.vol_mid;
          else iconBox.innerHTML = ICONS.vol_low;

          document.documentElement.style.setProperty('--accent', 'var(--flamingo)');
          document.documentElement.style.setProperty('--accent-gradient', 'var(--mauve)');
          fillBar.style.width = val + '%';
          valBadge.textContent = val + '%';
        }
      } else if (type === 'brightness') {
        iconBox.innerHTML = ICONS.brightness;
        document.documentElement.style.setProperty('--accent', 'var(--peach)');
        document.documentElement.style.setProperty('--accent-gradient', '#f9e2af');
        fillBar.style.width = val + '%';
        valBadge.textContent = val + '%';
      } else if (type === 'mic') {
        if (muted) {
          iconBox.innerHTML = ICONS.mic_mute;
          document.documentElement.style.setProperty('--accent', 'var(--red)');
          document.documentElement.style.setProperty('--accent-gradient', 'var(--red)');
          fillBar.style.width = '0%';
          valBadge.textContent = 'Muted';
        } else {
          iconBox.innerHTML = ICONS.mic_active;
          document.documentElement.style.setProperty('--accent', 'var(--flamingo)');
          document.documentElement.style.setProperty('--accent-gradient', 'var(--mauve)');
          fillBar.style.width = '100%';
          valBadge.textContent = 'Active';
        }
      }

      pill.classList.remove('hidden');
      pill.classList.add('visible');
    };

    window.animateHideOSD = function() {
      pill.classList.remove('visible');
      pill.classList.add('hidden');
    };
  </script>
</body>
</html>
